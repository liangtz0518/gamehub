<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub · GameHub</title>
<link rel="preconnect" href="https://liangtz0518.github.io" crossorigin>
<link rel="preconnect" href="https://www.kdocs.cn" crossorigin>
<link rel="dns-prefetch" href="//liangtz0518.github.io">
<link rel="dns-prefetch" href="//www.kdocs.cn">
<style>
/* ============================================================
   GameHub
   ============================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:        #f2f5fa;
  --surface:   #ffffff;
  --surface-2: #f7f9fc;
  --border:    #e3e8f0;
  --border-2:  #d3dae6;
  --text:      #1e293b;
  --text-2:    #64748b;
  --text-3:    #94a3b8;
  --accent:    #4f46e5;
  --accent-soft: #eef2ff;
  --green:     #10b981;
  --topbar-h:  52px;
  --side-w:    226px;
}

html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
svg { display: block; }
button { font-family: inherit; color: inherit; }

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

/* ---------- 顶栏 ---------- */
.topbar {
  height: var(--topbar-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 20;
}
.brand {
  font-size: 15px;
  font-weight: 750;
  letter-spacing: -.2px;
  color: var(--text);
  flex-shrink: 0;
}

/* 公告区 */
.announce {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 26px;
  min-width: 0;
  max-width: 460px;
  padding: 0 12px;
  border-radius: 16px;
  background: #f0fdf7;
  border: 1px solid #d5f5e3;
  flex-shrink: 1;
  overflow: hidden;
}
.announce-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
  box-shadow: 0 0 0 3px rgba(16,185,129,.13);
  animation: breathe 2.2s ease-in-out infinite;
}
@keyframes breathe {
  50% { opacity: .4; box-shadow: 0 0 0 5px rgba(16,185,129,.05), 0 0 9px var(--green); }
}
.announce-viewport {
  position: relative;
  flex: 1;
  height: 100%;
  min-width: 0;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
}
.announce-track {
  display: inline-flex;
  align-items: center;
  height: 100%;
  white-space: nowrap;
  will-change: transform;
  animation: marquee var(--marquee-dur, 18s) linear infinite;
}
.announce:hover .announce-track { animation-play-state: paused; }
.announce-track span {
  font-size: 11.5px; color: #047857;
  padding-right: 56px;
}
@keyframes marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

.top-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

/* 顶栏预热 */
.warm-mini {
  position: relative;
  display: flex; align-items: center;
  height: 26px;
  min-width: 118px;
  padding: 0 10px;
  border-radius: 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  overflow: hidden;
}
/* 预热中 */
.warm-loading {
  display: flex; align-items: center; gap: 8px;
  width: 100%;
  transition: opacity .45s ease, transform .45s cubic-bezier(.4,0,.2,1), filter .45s ease;
}
.warm-mini-num {
  font-size: 11px; font-weight: 650; color: var(--text-2);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.warm-mini-track {
  width: 56px; height: 4px; border-radius: 4px;
  background: #e8ecf3; overflow: hidden;
}
.warm-mini-fill {
  height: 100%; width: 0; border-radius: 4px;
  background: linear-gradient(90deg, var(--accent), var(--green));
  transition: width .5s cubic-bezier(.4,0,.2,1);
}
/* 完成态：系统运行中 —— 铭牌样式（边框呼吸，与公告区分） */
.warm-done {
  position: absolute;
  inset: -1px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 10px;
  white-space: nowrap;
  font-size: 10.5px; font-weight: 700; letter-spacing: .4px;
  color: #047857;
  background: #fff;
  border: 1.5px solid #34d399;
  border-radius: 14px;
  opacity: 0;
  transform: translateY(6px) scale(.97);
  pointer-events: none;
  transition: opacity .5s ease, transform .55s cubic-bezier(.34,1.35,.64,1);
}
.warm-done svg { color: #10b981; }
.warm-mini.ready {
  background: transparent;
  border-color: transparent;
  overflow: visible;
  animation: plaque-breathe 2.6s ease-in-out infinite;
}
@keyframes plaque-breathe {
  0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  50% { box-shadow: 0 0 0 4px rgba(16,185,129,.12), 0 0 14px rgba(16,185,129,.28); }
}
.warm-mini.ready .warm-loading {
  opacity: 0;
  transform: translateY(-6px);
  filter: blur(2px);
}
.warm-mini.ready .warm-done {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* 顶栏按钮 */
.top-btn {
  height: 29px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
  color: var(--text-2);
  font-size: 11.5px;
  cursor: pointer;
  transition: all .15s ease;
}
.top-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.top-btn.icon-only { width: 29px; padding: 0; }
.top-btn.active { background: var(--accent-soft); color: var(--accent); border-color: #c7d2fe; }

.clock {
  font-size: 12px; font-weight: 650; color: var(--text-2);
  font-variant-numeric: tabular-nums; white-space: nowrap;
  padding: 0 12px 0 0;
  border-right: 1px solid var(--border);
  height: 18px;
  display: flex; align-items: center;
}

/* ---------- 布局 ---------- */
.layout { flex: 1; display: flex; min-height: 0; }

/* 侧栏 */
.sidebar {
  width: var(--side-w);
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow: hidden;
  transition: width .26s cubic-bezier(.4,0,.2,1);
}
body.side-collapsed .sidebar { width: 0; border-right-width: 0; }

.nav {
  height: 100%;
  width: var(--side-w);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-2) transparent;
}
.nav::-webkit-scrollbar { width: 5px; }
.nav::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

.cat { margin-bottom: 5px; }
.cat-head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer; user-select: none;
  transition: background .14s ease;
}
.cat-head:hover { background: var(--surface-2); }
.cat-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cat); flex-shrink: 0;
}
.cat-name {
  flex: 1; min-width: 0;
  font-size: 12.5px; font-weight: 650; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cat-arrow { color: var(--text-3); flex-shrink: 0; transition: transform .22s ease; }
.cat.collapsed .cat-arrow { transform: rotate(-90deg); }
.cat-items {
  overflow: hidden;
  transition: max-height .26s cubic-bezier(.4,0,.2,1), opacity .18s ease;
  opacity: 1;
}
.cat.collapsed .cat-items { max-height: 0 !important; opacity: 0; }

.tool {
  display: flex; align-items: center;
  width: 100%; padding: 7px 10px 7px 24px;
  border: none; background: transparent;
  color: var(--text-2); font-size: 12px;
  text-align: left; cursor: pointer;
  border-radius: 7px; position: relative;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: all .14s ease;
}
.tool:hover { background: var(--surface-2); color: var(--text); }
.tool.active {
  background: var(--accent-soft);
  color: var(--accent); font-weight: 650;
}
.tool.active::before {
  content: ''; position: absolute; left: 0; top: 5px; bottom: 5px;
  width: 2.5px; border-radius: 0 3px 3px 0;
  background: var(--cat);
}

/* ---------- 内容 ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.viewport { flex: 1; min-height: 0; position: relative; background: #fff; }
.game-frame {
  position: absolute; top: 0; left: -10000px;
  width: 100%; height: 100%; border: none; background: #fff;
}
.game-frame.active { left: 0; }

/* 加载进度 */
.load-progress {
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  z-index: 8; pointer-events: none; opacity: 0;
  transition: opacity .25s ease; overflow: hidden;
  background: rgba(79,70,229,.08);
}
.load-progress.show { opacity: 1; }
.load-progress::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 32%;
  background: linear-gradient(90deg, #4f46e5, #10b981, #4f46e5);
  background-size: 200% 100%;
  animation: bar-slide 1.05s ease-in-out infinite, bar-shine 1.5s linear infinite;
}
@keyframes bar-slide { 0% { left: -32%; } 100% { left: 100%; } }
@keyframes bar-shine { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }

/* ---------- 彩蛋页：弹跳小怪物 ---------- */
.easter {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 22px;
  background: #fff;
  opacity: 0; pointer-events: none;
  transition: opacity .4s ease;
  z-index: 2;
  user-select: none;
}
.easter.show { opacity: 1; pointer-events: auto; }
.easter-intro {
  position: absolute; left: 0; right: 0; bottom: 7%;
  text-align: center; pointer-events: none;
}

/* 抽烟柴犬（原图内嵌 + CSS 动效） */
.dog-stage {
  position: absolute; left: 0; top: 0;
  width: 240px; height: 232px;
  display: grid; place-items: center;
  pointer-events: none;
  perspective: 900px;
  transition: left .9s cubic-bezier(.22,1,.36,1), top .9s cubic-bezier(.22,1,.36,1);
}
.dog-shadow {
  position: absolute; bottom: 0;
  width: 96px; height: 11px;
  border-radius: 50%;
  background: rgba(79,70,229,.14);
  filter: blur(2px);
  animation: dog-shadow 3s ease-in-out infinite;
}
@keyframes dog-shadow {
  0%, 100% { transform: scaleX(1); opacity: .8; }
  50% { transform: scaleX(.7); opacity: .4; }
}
.shiba-img {
  position: relative;
  width: 230px; height: auto; display: block;
  transform-origin: center 92%;
  animation: dog-breathe 3s ease-in-out infinite;
  -webkit-user-drag: none;
}
@keyframes dog-breathe {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-6px) scale(1.01, .99); }
}
/* 点击冒烟反馈 */
.puff {
  position: absolute; left: 40px; top: 94px;
  width: 9px; height: 9px; border-radius: 50%;
  background: rgba(140,148,160,.55);
  filter: blur(3px); opacity: 0; pointer-events: none;
}
.dog-stage.pop .puff { animation: puff-rise .95s ease-out; }
.dog-stage.pop .puff.p2 { animation-delay: .12s; left: 35px; top: 92px; }
.dog-stage.pop .puff.p3 { animation-delay: .24s; left: 45px; top: 96px; }
@keyframes puff-rise {
  0% { opacity: 0; transform: translate(0,0) scale(.6); }
  25% { opacity: .75; }
  100% { opacity: 0; transform: translate(-18px,-54px) scale(2.3); }
}
.dog-stage:active .shiba-img { animation: none; transform: scale(1.05) rotate(-3deg); }
.dog-stage.pop .shiba-img { animation: dog-pop .46s cubic-bezier(.34,1.56,.64,1); }
@keyframes dog-pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.16) rotate(6deg); }
  100% { transform: scale(1); }
}
.dog-stage.running .shiba-img { animation: var(--run-anim, dog-hop) var(--run-dur, .9s) cubic-bezier(.3,.7,.4,1); }
@keyframes dog-hop {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  28% { transform: translateY(-20px) rotate(-9deg); }
  60% { transform: translateY(-7px) rotate(7deg); }
  80% { transform: translateY(-2px) rotate(-3deg); }
}
/* 旋转一圈 */
@keyframes dog-spin {
  0% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.12); }
  100% { transform: rotate(360deg) scale(1); }
}
/* 左右横跳 */
@keyframes dog-shuffle {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  18% { transform: translateX(-24px) rotate(-14deg); }
  38% { transform: translateX(22px) rotate(13deg); }
  58% { transform: translateX(-15px) rotate(-9deg); }
  78% { transform: translateX(11px) rotate(6deg); }
}
/* 后空翻 */
@keyframes dog-flip {
  0% { transform: rotateY(0deg) translateY(0); }
  50% { transform: rotateY(180deg) translateY(-18px); }
  100% { transform: rotateY(360deg) translateY(0); }
}
/* 缩放弹跳 */
@keyframes dog-zoom {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.24, .84) translateY(6px); }
  60% { transform: scale(.88, 1.16) translateY(-12px); }
}
/* 嘲讽气泡 */
.taunt-bubble {
  position: absolute; bottom: 100%; left: 50%;
  margin: 0 0 14px 0;
  transform: translate(-50%, 8px) scale(.9);
  transform-origin: bottom center;
  max-width: 240px; width: max-content;
  padding: 9px 14px;
  background: #312e81; color: #fff;
  font-size: 13px; font-weight: 650; line-height: 1.4;
  border-radius: 12px;
  box-shadow: 0 8px 22px rgba(49,46,129,.28);
  opacity: 0; pointer-events: none; white-space: normal;
  transition: opacity .3s ease, transform .42s cubic-bezier(.34,1.56,.64,1);
  z-index: 6;
}
.taunt-bubble::after {
  content: ''; position: absolute; top: 100%; left: 50%;
  transform: translateX(-50%);
  border: 7px solid transparent; border-top-color: #312e81;
}
.taunt-bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.easter-title {
  font-size: 17px; font-weight: 750; color: #312e81;
  letter-spacing: .3px;
}
.easter-hint {
  font-size: 12px; color: var(--text-3);
  text-align: center; line-height: 1.7;
}
.easter-hint b { color: var(--accent); font-weight: 700; }

/* ---------- 更新提示 ---------- */
.update-toast {
  position: fixed; top: 64px; right: 18px; z-index: 100;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  box-shadow: 0 16px 40px rgba(15,23,42,.14);
  transform: translateX(140%); opacity: 0;
  transition: transform .4s cubic-bezier(.34,1.35,.64,1), opacity .3s ease;
  max-width: 340px;
}
.update-toast.show { transform: translateX(0); opacity: 1; }
.up-icon {
  width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
}
.up-text { display: flex; flex-direction: column; gap: 3px; }
.up-title { font-size: 12.5px; font-weight: 650; }
.up-sub { font-size: 11px; color: var(--text-3); }
.up-btn {
  border: none; border-radius: 6px; padding: 6px 11px;
  background: var(--accent); color: #fff;
  font-size: 11.5px; font-weight: 650; cursor: pointer; white-space: nowrap;
}
.up-btn:hover { background: #4338ca; }
.up-close { border: none; background: none; color: var(--text-3); cursor: pointer; padding: 2px; align-self: flex-start; }
.up-close:hover { color: var(--text); }

.tiny-toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #1e293b; color: #fff;
  border-radius: 8px; padding: 8px 15px; font-size: 11.5px;
  z-index: 110; opacity: 0; pointer-events: none;
  transition: all .22s ease; box-shadow: 0 10px 28px rgba(15,23,42,.25);
}
.tiny-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 720px) {
  .announce { max-width: 150px; }
  .clock, .warm-mini-num { display: none; }
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">GameHub</div>

    <div class="announce" id="announce">
      <span class="announce-dot"></span>
      <div class="announce-viewport"><div class="announce-track" id="announceTrack"></div></div>
    </div>

    <div class="top-right">
      <span class="clock" id="clock">--:--:--</span>
      <div class="warm-mini" id="warmMini" title="页面预热进度">
        <div class="warm-loading">
          <span class="warm-mini-track"><span class="warm-mini-fill" id="warmFill"></span></span>
          <span class="warm-mini-num" id="warmNum">0 / 0</span>
        </div>
        <div class="warm-done">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          系统运行中
        </div>
      </div>
      <button class="top-btn icon-only dog-btn" id="dogBtn" title="找狗玩玩" aria-label="找狗玩玩">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.6 4.4 8.6 7.4 M19.4 4.4 15.4 7.4" stroke-width="2"/>
          <path d="M4.8 3.9 9 7.3 6.7 9.4 Z M19.2 3.9 15 7.3 17.3 9.4 Z" fill="currentColor" opacity=".18" stroke="none"/>
          <ellipse cx="12" cy="12.6" rx="7.6" ry="6.9" fill="#fff"/>
          <path d="M6.9 12 Q8.8 10.6 10.7 12 M13.3 12 Q15.2 10.6 17.1 12" stroke-width="1.9"/>
          <ellipse cx="12" cy="14.7" rx="1.6" ry="1.15" fill="currentColor" stroke="none"/>
          <path d="M12 15.9 Q10.4 17.4 8.9 16.3 M12 15.9 Q13.6 17.4 15.1 16.3"/>
          <path d="M14.8 15.4 20 13.6" stroke-width="1.5"/>
          <circle cx="20.3" cy="13.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button class="top-btn" id="openBtn" title="在新窗口打开">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M10 14 20 4"/><path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"/></svg>
        
      </button>
      <button class="top-btn icon-only" id="toggleSideBtn" title="收起侧栏">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="nav" id="sidebarNav"></nav>
    </aside>

    <main class="main">
      <div class="viewport" id="stage">
        <div class="load-progress" id="loadProgress"></div>
        <div class="easter show" id="easter">
          <div class="easter-intro">
            <div class="easter-title">嘿~ 👋</div>
            <div class="easter-hint">——<br>不懂的 <b>多问</b>  😎</div>
          </div>

let allItems = [];
let activeGlobalIdx = -1;
let frameCache = {};
let loadingCount = 0;

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function buildIndex() {
  allItems = [];
  CATEGORIES.forEach((cat, ci) => {
    cat.items.forEach((item, ii) => {
      allItems.push({ catIndex: ci, itemIndex: ii, name: item.name, url: item.url, color: cat.color });
    });
  });
}
function buildFrameUrl(item) {
  const sep = item.url.includes('?') ? '&' : '?';
  return item.url + sep + 'hub_v=' + HUB_VERSION;
}

/* ---------- 侧栏渲染 ---------- */
function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  let gi = 0;
  nav.innerHTML = CATEGORIES.map((cat, ci) => {
    const tools = cat.items.map(() => {
      const idx = gi++;
      return `<button class="tool" data-gi="${idx}" onclick="selectItem(${idx})">${escapeHtml(allItems[idx].name)}</button>`;
    }).join('');
    return `
      <div class="cat${cat.collapsed ? ' collapsed' : ''}" id="cat-${ci}" style="--cat:${cat.color}">
        <div class="cat-head" onclick="toggleCategory(${ci})">
          <span class="cat-dot"></span>
          <span class="cat-name">${escapeHtml(cat.name)}</span>
          <span class="cat-arrow">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
        <div class="cat-items" style="max-height:${cat.items.length * 32 + 6}px">${tools}</div>
      </div>`;
  }).join('');
}
function toggleCategory(ci) {
  document.getElementById('cat-' + ci).classList.toggle('collapsed');
}
function updateWarm() {
  const done = Object.values(frameCache).filter(f => f.dataset.state === 'loaded').length;
  document.getElementById('warmNum').textContent = done + ' / ' + allItems.length;
  document.getElementById('warmFill').style.width = (allItems.length ? done / allItems.length * 100 : 0) + '%';
  const ready = allItems.length > 0 && done >= allItems.length;
  document.getElementById('warmMini').classList.toggle('ready', ready);
}

/* ---------- 侧栏收起 ---------- */
function applySide() {
  const collapsed = localStorage.getItem('gh-side-collapsed') === '1';
  document.body.classList.toggle('side-collapsed', collapsed);
  const btn = document.getElementById('toggleSideBtn');
  btn.classList.toggle('active', collapsed);
  btn.title = collapsed ? '展开侧栏' : '收起侧栏';
}
function toggleSide() {
  const collapsed = localStorage.getItem('gh-side-collapsed') === '1';
  localStorage.setItem('gh-side-collapsed', collapsed ? '0' : '1');
  applySide();
}

/* ---------- 加载态 ---------- */
function setProgress(on) {
  const bar = document.getElementById('loadProgress');
  if (on) { loadingCount++; bar.classList.add('show'); }
  else { loadingCount = Math.max(0, loadingCount - 1); if (loadingCount === 0) bar.classList.remove('show'); }
}

/* ---------- 选择 / iframe ---------- */
function selectItem(gi) {
  if (gi < 0 || gi >= allItems.length) return;
  activeGlobalIdx = gi;

  // 进入工具页：隐藏彩蛋页，并重置彩蛋速度挡位
  document.getElementById('easter').classList.remove('show');
  document.getElementById('monsterStage').dataset.flee = '0';

  const cat = document.getElementById('cat-' + allItems[gi].catIndex);
  if (cat) cat.classList.remove('collapsed');

  document.querySelectorAll('.tool').forEach(el => el.classList.remove('active'));
  const target = document.querySelector('.tool[data-gi="' + gi + '"]');
  if (target) target.classList.add('active');

  document.querySelectorAll('.game-frame').forEach(el => el.classList.remove('active'));

  const frame = frameCache[gi] || createFrame(gi);
  if (!frame) return;
  frame.classList.add('active');
  startLoad(gi);
}
function createFrame(gi) {
  const item = allItems[gi];
  if (!item || !item.url) return null;
  if (frameCache[gi]) return frameCache[gi];
  const host = document.getElementById('stage');
  const frame = document.createElement('iframe');
  frame.className = 'game-frame';
  frame.id = 'frame-' + gi;
  frame.allow = 'clipboard-read; clipboard-write';
  frame.dataset.state = 'idle';
  frame.addEventListener('load', () => finishLoad(gi));
  frame.addEventListener('error', () => finishLoad(gi));
  host.appendChild(frame);
  frameCache[gi] = frame;
  return frame;
}
function startLoad(gi) {
  const frame = frameCache[gi];
  const item = allItems[gi];
  if (!frame || !item || frame.dataset.state !== 'idle') return;
  frame.dataset.state = 'loading';
  setProgress(true);
  frame.src = buildFrameUrl(item);
  setTimeout(() => { if (frame.dataset.state === 'loading') finishLoad(gi); }, 8000);
}
function finishLoad(gi) {
  const frame = frameCache[gi];
  if (!frame || frame.dataset.state !== 'loading') return;
  frame.dataset.state = 'loaded';
  setProgress(false);
  updateWarm();
}

/* ---------- 后台串行预热 ---------- */
let warmQueue = [];
let warming = false;
function warmAll() {
  // 默认展开的分类优先预热，其次才是默认收起的
  warmQueue = allItems
    .map((_, i) => i)
    .filter(i => i !== activeGlobalIdx)
    .sort((a, b) => {
      const pa = CATEGORIES[allItems[a].catIndex].collapsed ? 1 : 0;
      const pb = CATEGORIES[allItems[b].catIndex].collapsed ? 1 : 0;
      return pa - pb || a - b;
    });
  pumpWarm();
}
function pumpWarm() {
  if (warming || warmQueue.length === 0) { updateWarm(); return; }
  const gi = warmQueue.shift();
  const frame = frameCache[gi] || createFrame(gi);
  if (!frame) { pumpWarm(); return; }
  if (frame.dataset.state === 'loaded') { pumpWarm(); return; }
  warming = true;
  startLoad(gi);
  const release = () => {
    if (!warming) return;
    warming = false;
    const next = () => pumpWarm();
    if ('requestIdleCallback' in window) requestIdleCallback(next, { timeout: 1500 });
    else setTimeout(next, 300);
  };
  frame.addEventListener('load', release, { once: true });
  frame.addEventListener('error', release, { once: true });
  setTimeout(release, 9000);
}

/* ---------- 操作 ---------- */
function openCurrent() {
  const item = allItems[activeGlobalIdx];
  if (!item) return;
  window.open(buildFrameUrl(item), '_blank', 'noopener');
}

/* ---------- 快捷键 Ctrl/⌘ + 1~9 ---------- */
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.ctrlKey || e.metaKey) {
    const num = parseInt(e.key);
    if (num >= 1 && num <= 9) {
      e.preventDefault();
      const gi = num - 1;
      if (gi < allItems.length) selectItem(gi);
    }
  }
});

/* ---------- 版本轮询 ---------- */
let versionUpdateDetected = false;
async function checkVersion() {
  if (versionUpdateDetected || !VERSION_CHECK_URL) return;
  try {
    const resp = await fetch(VERSION_CHECK_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) return;
    const data = await resp.json();
    const remoteVersion = String(data.version || '');
    if (remoteVersion && remoteVersion !== HUB_VERSION) {
      versionUpdateDetected = true;
      document.getElementById('upTitle').textContent = '检测到新版本 ' + remoteVersion;
      document.getElementById('updateToast').classList.add('show');
    }
  } catch (e) {}
}
function doRefresh() { location.reload(); }

/* ---------- 时钟 ---------- */
function tickClock() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

const TAUNTS = [
  '就这？？？',
  '别追了，我烟都要灭了 🚬',
  '抓得到我算你赢 😏',
  '这么闲？',
  '你看起来有点狼狈',

/* 交互*/
(function initEaster() {
  const easter = document.getElementById('easter');
  const stage = document.getElementById('monsterStage');
  const bubble = document.getElementById('tauntBubble');
  const DW = 240, DH = 232;
  const WARN = 76, ESCAPE = 330;
  let bubbleTimer = null, runningTimer = null, lastIdx = -1;
  let lastFleeAt = 0;
  // 只防同一帧高频重复，不等待动画/位移结束 → 鼠标靠近可立即打断当前动画
  const FLEE_GAP = 80;
  // 每 3 次逃跑提速一档：动画时长与位移速度同步加快（共 8 档，越躲越快）
  const SPEED_TIERS = [
    { anim: .9,  move: .9  },
    { anim: .72, move: .74 },
    { anim: .58, move: .6  },
    { anim: .46, move: .48 },
    { anim: .36, move: .38 },
    { anim: .27, move: .29 },
    { anim: .20, move: .22 },
    { anim: .14, move: .16 }
  ];
  const ANIMS = ['dog-hop', 'dog-spin', 'dog-shuffle', 'dog-flip', 'dog-zoom'];
  let lastAnim = '';

  function place(x, y) { stage.style.left = x + 'px'; stage.style.top = y + 'px'; }
  function center() {
    place((easter.clientWidth - DW) / 2, (easter.clientHeight - DH) / 2 + 28);
  }
  // 首屏定位：先禁用过渡，避免从左上角滑入
  stage.style.transition = 'none';
  requestAnimationFrame(() => { center(); requestAnimationFrame(() => { stage.style.transition = ''; }); });
  window.addEventListener('resize', () => { if (!stage.dataset.moved) center(); });

  // 点到矩形的最短距离（0 表示指针落在矩形内）
  function distToRect(mx, my, rx, ry, rw, rh) {
    const dx = Math.max(rx - mx, 0, mx - (rx + rw));
    const dy = Math.max(ry - my, 0, my - (ry + rh));
    return Math.hypot(dx, dy);
  }

  function flee(mx, my) {
    const now = performance.now();
    if (now - lastFleeAt < FLEE_GAP) return;
    lastFleeAt = now;
    const w = easter.clientWidth, h = easter.clientHeight;
    const minX = 16, maxX = Math.max(minX, w - DW - 16);
    const minY = 64, maxY = Math.max(minY, h - DH - 32);
    let nx = minX, ny = minY, found = false;
    for (let t = 0; t < 40; t++) {
      const tx = minX + Math.random() * (maxX - minX);
      const ty = minY + Math.random() * (maxY - minY);
      if (distToRect(mx, my, tx, ty, DW, DH) >= ESCAPE) { nx = tx; ny = ty; found = true; break; }
    }
    if (!found) {
      let best = -1;
      for (let t = 0; t < 24; t++) {
        const tx = minX + Math.random() * (maxX - minX);
        const ty = minY + Math.random() * (maxY - minY);
        const d = distToRect(mx, my, tx, ty, DW, DH);
        if (d > best) { best = d; nx = tx; ny = ty; }
      }
    }
    place(nx, ny);
    stage.dataset.moved = '1';
    const fleeCount = (+stage.dataset.flee || 0) + 1;
    stage.dataset.flee = fleeCount;

    const tier = SPEED_TIERS[Math.min(SPEED_TIERS.length - 1, Math.floor(fleeCount / 3))];
    let anim;
    do { anim = ANIMS[Math.floor(Math.random() * ANIMS.length)]; }
    while (ANIMS.length > 1 && anim === lastAnim);
    lastAnim = anim;
    stage.style.setProperty('--run-anim', anim);
    stage.style.setProperty('--run-dur', tier.anim + 's');
    stage.style.transitionDuration = tier.move + 's';
    clearTimeout(runningTimer);
    stage.classList.remove('running', 'pop');
    void stage.offsetWidth;
    stage.classList.add('running');
    runningTimer = setTimeout(() => stage.classList.remove('running'), tier.anim * 1000 + 50);

    let idx = 0;
    if (TAUNTS.length > 1) {
      do { idx = Math.floor(Math.random() * TAUNTS.length); } while (idx === lastIdx);
    }
    lastIdx = idx;
    bubble.textContent = TAUNTS[idx] || '……';
    bubble.classList.remove('show');
    void bubble.offsetWidth;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 3400);

  }

  // 鼠标靠近就逃：进入警戒圈立即跑开
  easter.addEventListener('mousemove', (e) => {
    if (!easter.classList.contains('show')) return;
    const r = stage.getBoundingClientRect();
    if (distToRect(e.clientX, e.clientY, r.left, r.top, r.width, r.height) < WARN) {
      flee(e.clientX, e.clientY);
    }
  });
})();
