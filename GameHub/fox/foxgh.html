<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GameHub</title>
    <script>
      try {
        var theme = localStorage.getItem("gt-theme");
        if (theme === "night" || (theme !== "day" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("night");
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="app/style.css" />
    <link rel="stylesheet" href="app/shell.css" />
    <link rel="stylesheet" href="app/components.css" />
    <link rel="stylesheet" href="app/home.css" />
    <link rel="stylesheet" href="app/interaction.css" />
    <link rel="stylesheet" href="app/compact.css" />
    <link rel="stylesheet" href="app/night.css" />
    <link rel="stylesheet" href="app/demo.css" />
    <link rel="stylesheet" href="app/hub.css" />
    <style>
      /* 主题切换：Dog / fox —— 玫瑰色圆角胶囊，贴合 fox 顶栏 */
      .gh-theme-switch { position: relative; flex: 0 0 auto; }
      .gh-ts-btn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 36px; height: 36px; padding: 0;
        border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
        border-radius: var(--r-md);
        background: var(--panel-2);
        color: var(--accent-strong);
        cursor: pointer;
        transition: background var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast);
      }
      .gh-ts-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
      .gh-ts-btn:active { transform: translateY(1px); }
      .gh-ts-btn:focus-visible { outline: none; box-shadow: var(--focus); }
      .gh-ts-btn > svg { width: 18px; height: 18px; flex: none; }
      .gh-ts-menu {
        position: absolute; top: calc(100% + 10px); right: 0;
        z-index: var(--z-shell-pop);
        width: 190px; padding: 7px;
        border: 1px solid var(--border); border-radius: var(--r-lg);
        background: var(--surface-float);
        box-shadow: var(--shadow-3);
        opacity: 0; transform: translateY(-6px) scale(.98); pointer-events: none;
        transition: opacity var(--t-fast), transform var(--t-base) var(--ease-spring);
      }
      .gh-theme-switch.open .gh-ts-menu { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
      #topbar.gh-ts-open { z-index: var(--z-shell-pop); }
      .gh-ts-title { padding: 5px 9px 6px; color: var(--muted); font-size: var(--fs-sm); font-weight: var(--fw-semibold); letter-spacing: var(--tracking-label); }
      .gh-ts-item {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 10px; border-radius: var(--r-md);
        color: var(--text); text-decoration: none;
        font-size: var(--fs-md); font-weight: var(--fw-medium);
        transition: background var(--t-fast), color var(--t-fast);
      }
      .gh-ts-item:hover { background: var(--accent-soft); color: var(--accent-strong); }
      .gh-ts-item.is-current { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent-strong); }
      .gh-ts-item > svg { width: 17px; height: 17px; flex: none; }
      .gh-ts-name { flex: 1; }
      .gh-ts-state { color: var(--muted); font-size: var(--fs-sm); }
      .gh-ts-item.is-current .gh-ts-state { color: var(--accent-strong); font-weight: var(--fw-bold); }
      @media (prefers-reduced-motion: reduce) {
        .gh-ts-menu, .gh-ts-btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app" class="sidebar-is-collapsed">
      <aside id="sidebar" data-tour="tabbar">
        <button class="brand" id="home-button" type="button" aria-label="返回欢迎页">
          <span class="brand-icon" aria-hidden="true"><img src="app/icon.png" alt="" width="40" height="40" /></span>
          <div class="brand-text">
            <b>GameHub<span class="brand-spark" aria-hidden="true">✦</span></b>
            <small id="brand-version"><span class="brand-ver">导航</span></small>
          </div>
        </button>

        <nav id="nav" class="nav" aria-label="功能导航"><div class="gt-nav-loading" role="status" aria-label="导航加载中"><i></i><i></i><i></i><i></i></div></nav>

        <button class="nav-more" id="more-button" type="button" aria-label="更多" aria-expanded="false" aria-controls="more-sheet">
          <span class="icon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></span><span class="name">更多</span>
        </button>

        <div class="sidebar-footer" id="more-sheet">
          <button class="ghost nav-page nav-home" type="button" id="home-sheet-button"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 11 8-6.5 8 6.5"/><path d="M6.5 9.5V19h11V9.5"/></svg></span><span class="name">首页</span></button>
          <button class="ghost nav-page nav-home" type="button" data-theme-toggle><span class="icon"><svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg></span><span class="name">白天 / 夜晚</span></button>
          <button class="ghost nav-page nav-feedback" type="button" id="feedback-button"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H10l-4.5 4v-4H6.5A2.5 2.5 0 0 1 4 13.5Z"/><path d="M12 7v3.5M12 13.5h.01"/></svg></span><span class="name">问题反馈</span></button>
        </div>
      </aside>

      <main id="main">
        <span class="leaf a" aria-hidden="true"></span><span class="leaf b" aria-hidden="true"></span><span class="leaf c" aria-hidden="true"></span>
        <header id="topbar">
          <div id="crumb" class="crumb">选择一个网站开始</div>
          <div id="topbar-search" class="topbar-search">
            <svg class="topbar-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>
            <input id="search" type="search" role="combobox" placeholder="搜索网站…" autocomplete="off" aria-label="搜索网站" aria-autocomplete="list" aria-controls="mascot-results" aria-expanded="false" aria-keyshortcuts="Control+K" />
            <kbd class="search-kbd">Ctrl+K</kbd>
            <div id="mascot-results" class="mascot-results topbar-results" role="listbox" aria-label="搜索结果" hidden></div>
          </div>
          <button id="open-window" type="button" class="ghost small theme-toggle open-window-btn" title="在新窗口打开当前网站" aria-label="在新窗口打开当前网站" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M10 14 20 4"/><path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"/></svg>
          </button>
          <button id="theme-toggle" type="button" class="ghost small theme-toggle" data-theme-toggle><svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg></button>
          <div class="gh-theme-switch" id="ghThemeSwitch">
            <button class="gh-ts-btn" id="ghThemeSwitchBtn" type="button" title="切换主题网站" aria-label="切换主题" aria-haspopup="true" aria-expanded="false" aria-controls="ghThemeSwitchMenu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5 8.4 8a8.5 8.5 0 0 1 7.2 0l4.4-3.5-.7 6.1a8 8 0 1 1-14.6 0Z" fill="currentColor" fill-opacity=".14"/><path d="M9.2 13h.01M14.8 13h.01" stroke-width="2.2"/><path d="m10.6 16 1.4 1.1L13.4 16"/></svg>
            </button>
            <div class="gh-ts-menu" id="ghThemeSwitchMenu" role="menu" aria-label="选择主题">
              <div class="gh-ts-title">选择主题</div>
              <a class="gh-ts-item" role="menuitem" href="https://liangtz0518.github.io/gamehub/GameHub/doggh.html">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="7" cy="9" rx="2" ry="2.6"/><ellipse cx="12" cy="6.6" rx="2" ry="2.8"/><ellipse cx="17" cy="9" rx="2" ry="2.6"/><ellipse cx="20" cy="13.5" rx="1.5" ry="2"/><path d="M12 11.5c3.1 0 6.4 2.6 6.4 5.2 0 1.8-1.4 3-3.2 3-1 0-1.8-.5-3.2-.5s-2.2.5-3.2.5c-1.8 0-3.2-1.2-3.2-3 0-2.6 3.3-5.2 6.4-5.2Z"/></svg>
                <span class="gh-ts-name">Dog</span><span class="gh-ts-state"></span>
              </a>
              <a class="gh-ts-item is-current" role="menuitem" href="https://liangtz0518.github.io/gamehub/GameHub/fox/foxgh.html" aria-current="page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5 8.4 8a8.5 8.5 0 0 1 7.2 0l4.4-3.5-.7 6.1a8 8 0 1 1-14.6 0Z" fill="currentColor" fill-opacity=".14"/><path d="M9.2 13h.01M14.8 13h.01" stroke-width="2.2"/><path d="m10.6 16 1.4 1.1L13.4 16"/></svg>
                <span class="gh-ts-name">Fox</span><span class="gh-ts-state">当前</span>
              </a>
              <a class="gh-ts-item" role="menuitem" href="https://liangtz0518.github.io/gamehub/GameHub/litegh.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="11" height="11" rx="2"/><path d="M9 20h9a2 2 0 0 0 2-2V9"/></svg>
                <span class="gh-ts-name">Lite</span><span class="gh-ts-state"></span>
              </a>
            </div>
          </div>
        </header>
        <section id="view" class="view">
          <div class="welcome">
            <canvas class="home-sky" aria-hidden="true"></canvas>
            <div class="home-inner">
              <div class="home-brand">
                <h1><span class="home-name-mark">Game</span>Hu<span class="home-title-tail">b<span class="home-mask" aria-hidden="true"><img src="app/assets/feiying-mask.webp" alt="" /></span></span></h1>
              </div>
              <canvas class="home-blade" width="260" height="44" aria-hidden="true"></canvas>
              <h2 class="home-ask"><span class="home-title-today">加油</span>又是新的一天</h2>
              <div class="home-tools" id="home-tools" data-tour="home-tools" aria-label="常用网站"></div>
              <div class="home-quick">
                <button type="button" class="home-quick-btn" data-guide="center" data-guide-from="home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="m15.5 8.5-2.2 5-5 2.2 2.2-5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>别点</button>
                <button type="button" class="home-quick-btn" data-whats-new><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3.5 14.4 9l5.6.5-4.3 3.7 1.3 5.6L12 15.9 7 18.8l1.3-5.6L4 9.5 9.6 9z"></path></svg>啥都没</button>
              </div>
              <dl class="home-meta">
                <div class="home-meta-row">
                  <dt>常用</dt>
                  <dd>
                    <a href="http://game.web.youlingplay.cn/"target="_blank" rel="noopener">游灵后台</a>
                    <span class="home-meta-sep" aria-hidden="true">·</span>
                    <a href="http://cpmanage.xy.mumuyouxi.com/main/default" target="_blank" rel="noopener">大道后台</a>
                  </dd>
                </div>
              </dl>
              <p class="home-legal"><a href="#/about/credits">有不懂的一定要多问，每周周报记得写。</a></p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="update-banner" id="update-banner" role="status" hidden>
      <span class="update-banner-text">检测到新版本</span>
      <button type="button" class="btn update-banner-btn" id="update-now">立即更新</button>
      <button type="button" class="ghost update-banner-btn" id="update-later">稍后</button>
    </div>

    <dialog class="gt-dialog" id="info-dialog">
      <h2 id="info-title" style="margin:0 0 12px;font-size:18px"></h2>
      <div id="info-body"></div>
      <div class="gt-dialog-actions"><button type="button" id="info-close" class="gt-dialog-primary">知道了</button></div>
    </dialog>

    <script src="app/welcome-sky.js"></script>
    <script src="app/ui.js?v=2"></script>
    <script>
      (function () {
        var wrap = document.getElementById('ghThemeSwitch');
        var btn = document.getElementById('ghThemeSwitchBtn');
        var topbar = document.getElementById('topbar');
        if (!wrap || !btn) return;
        function closeMenu() {
          wrap.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
          if (topbar) topbar.classList.remove('gh-ts-open');
        }
        btn.addEventListener('click', function (event) {
          event.stopPropagation();
          var open = !wrap.classList.contains('open');
          wrap.classList.toggle('open', open);
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          if (topbar) topbar.classList.toggle('gh-ts-open', open);
        });
        document.addEventListener('click', function (event) {
          if (!wrap.contains(event.target)) closeMenu();
        });
        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') closeMenu();
        });
      })();
    </script>
  </body>
</html>
