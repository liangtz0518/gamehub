<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub</title>
<link rel="preconnect" href="https://liangtz0518.github.io" crossorigin>
<link rel="preconnect" href="https://www.kdocs.cn" crossorigin>
<link rel="dns-prefetch" href="//liangtz0518.github.io">
<link rel="dns-prefetch" href="//www.kdocs.cn">
<style>
/* ============================================================
   GameHub
   ============================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:        #f2f5fa;
  --surface:   #ffffff;
  --surface-2: #f7f9fc;
  --border:    #e3e8f0;
  --border-2:  #d3dae6;
  --text:      #1e293b;
  --text-2:    #64748b;
  --text-3:    #94a3b8;
  --accent:    #4f46e5;
  --accent-soft: #eef2ff;
  --green:     #10b981;
  --topbar-h:  52px;
  --side-w:    226px;
}

html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
svg { display: block; }
button { font-family: inherit; color: inherit; }

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

/* ---------- 顶栏 ---------- */
.topbar {
  height: var(--topbar-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 20;
}
.brand {
  font-size: 15px;
  font-weight: 750;
  letter-spacing: -.2px;
  color: var(--text);
  flex-shrink: 0;
}

/* 公告区 */
.announce {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 26px;
  min-width: 0;
  max-width: 460px;
  padding: 0 12px;
  border-radius: 16px;
  background: #f0fdf7;
  border: 1px solid #d5f5e3;
  flex-shrink: 1;
  overflow: hidden;
}
.announce-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
  box-shadow: 0 0 0 3px rgba(16,185,129,.13);
  animation: breathe 2.2s ease-in-out infinite;
}
@keyframes breathe {
  50% { opacity: .4; box-shadow: 0 0 0 5px rgba(16,185,129,.05), 0 0 9px var(--green); }
}
.announce-viewport {
  position: relative;
  flex: 1;
  height: 100%;
  min-width: 0;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
}
.announce-track {
  display: inline-flex;
  align-items: center;
  height: 100%;
  white-space: nowrap;
  will-change: transform;
  animation: marquee var(--marquee-dur, 18s) linear infinite;
}
.announce:hover .announce-track { animation-play-state: paused; }
.announce-track span {
  font-size: 11.5px; color: #047857;
  padding-right: 56px;
}
@keyframes marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

.top-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

/* 顶栏预热 */
.warm-mini {
  position: relative;
  display: flex; align-items: center;
  height: 26px;
  min-width: 118px;
  padding: 0 10px;
  border-radius: 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  overflow: hidden;
}
/* 预热中 */
.warm-loading {
  display: flex; align-items: center; gap: 8px;
  width: 100%;
  transition: opacity .45s ease, transform .45s cubic-bezier(.4,0,.2,1), filter .45s ease;
}
.warm-mini-num {
  font-size: 11px; font-weight: 650; color: var(--text-2);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.warm-mini-track {
  width: 56px; height: 4px; border-radius: 4px;
  background: #e8ecf3; overflow: hidden;
}
.warm-mini-fill {
  height: 100%; width: 0; border-radius: 4px;
  background: linear-gradient(90deg, var(--accent), var(--green));
  transition: width .5s cubic-bezier(.4,0,.2,1);
}
/* 完成态：系统运行中 —— 铭牌样式（边框呼吸，与公告区分） */
.warm-done {
  position: absolute;
  inset: -1px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 10px;
  white-space: nowrap;
  font-size: 10.5px; font-weight: 700; letter-spacing: .4px;
  color: #047857;
  background: #fff;
  border: 1.5px solid #34d399;
  border-radius: 14px;
  opacity: 0;
  transform: translateY(6px) scale(.97);
  pointer-events: none;
  transition: opacity .5s ease, transform .55s cubic-bezier(.34,1.35,.64,1);
}
.warm-done svg { color: #10b981; }
.warm-mini.ready {
  background: transparent;
  border-color: transparent;
  overflow: visible;
  animation: plaque-breathe 2.6s ease-in-out infinite;
}
@keyframes plaque-breathe {
  0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  50% { box-shadow: 0 0 0 4px rgba(16,185,129,.12), 0 0 14px rgba(16,185,129,.28); }
}
.warm-mini.ready .warm-loading {
  opacity: 0;
  transform: translateY(-6px);
  filter: blur(2px);
}
.warm-mini.ready .warm-done {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* 顶栏按钮 */
.top-btn {
  height: 29px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
  color: var(--text-2);
  font-size: 11.5px;
  cursor: pointer;
  transition: all .15s ease;
}
.top-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.top-btn.icon-only { width: 29px; padding: 0; }
.top-btn.active { background: var(--accent-soft); color: var(--accent); border-color: #c7d2fe; }

.clock {
  font-size: 12px; font-weight: 650; color: var(--text-2);
  font-variant-numeric: tabular-nums; white-space: nowrap;
  padding: 0 12px 0 0;
  border-right: 1px solid var(--border);
  height: 18px;
  display: flex; align-items: center;
}

/* ---------- 布局 ---------- */
.layout { flex: 1; display: flex; min-height: 0; }

/* 侧栏 */
.sidebar {
  width: var(--side-w);
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow: hidden;
  transition: width .26s cubic-bezier(.4,0,.2,1);
}
body.side-collapsed .sidebar { width: 0; border-right-width: 0; }

.nav {
  height: 100%;
  width: var(--side-w);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-2) transparent;
}
.nav::-webkit-scrollbar { width: 5px; }
.nav::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

.cat { margin-bottom: 5px; }
.cat-head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer; user-select: none;
  transition: background .14s ease;
}
.cat-head:hover { background: var(--surface-2); }
.cat-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cat); flex-shrink: 0;
}
.cat-name {
  flex: 1; min-width: 0;
  font-size: 12.5px; font-weight: 650; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cat-arrow { color: var(--text-3); flex-shrink: 0; transition: transform .22s ease; }
.cat.collapsed .cat-arrow { transform: rotate(-90deg); }
.cat-items {
  overflow: hidden;
  transition: max-height .26s cubic-bezier(.4,0,.2,1), opacity .18s ease;
  opacity: 1;
}
.cat.collapsed .cat-items { max-height: 0 !important; opacity: 0; }

.tool {
  display: flex; align-items: center;
  width: 100%; padding: 7px 10px 7px 24px;
  border: none; background: transparent;
  color: var(--text-2); font-size: 12px;
  text-align: left; cursor: pointer;
  border-radius: 7px; position: relative;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: all .14s ease;
}
.tool:hover { background: var(--surface-2); color: var(--text); }
.tool.active {
  background: var(--accent-soft);
  color: var(--accent); font-weight: 650;
}
.tool.active::before {
  content: ''; position: absolute; left: 0; top: 5px; bottom: 5px;
  width: 2.5px; border-radius: 0 3px 3px 0;
  background: var(--cat);
}

/* ---------- 内容 ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.viewport { flex: 1; min-height: 0; position: relative; background: #fff; }
.game-frame {
  position: absolute; top: 0; left: -10000px;
  width: 100%; height: 100%; border: none; background: #fff;
}
.game-frame.active { left: 0; }

/* 加载进度 */
.load-progress {
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  z-index: 8; pointer-events: none; opacity: 0;
  transition: opacity .25s ease; overflow: hidden;
  background: rgba(79,70,229,.08);
}
.load-progress.show { opacity: 1; }
.load-progress::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 32%;
  background: linear-gradient(90deg, #4f46e5, #10b981, #4f46e5);
  background-size: 200% 100%;
  animation: bar-slide 1.05s ease-in-out infinite, bar-shine 1.5s linear infinite;
}
@keyframes bar-slide { 0% { left: -32%; } 100% { left: 100%; } }
@keyframes bar-shine { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }

/* ---------- 彩蛋页：弹跳小怪物 ---------- */
.easter {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 22px;
  background: #fff;
  opacity: 0; pointer-events: none;
  transition: opacity .4s ease;
  z-index: 2;
  user-select: none;
}
.easter.show { opacity: 1; pointer-events: auto; }
.easter-intro {
  position: absolute; left: 0; right: 0; bottom: 7%;
  text-align: center; pointer-events: none;
}

/* 抽烟柴犬（原图内嵌 + CSS 动效） */
.dog-stage {
  position: absolute; left: 0; top: 0;
  width: 240px; height: 232px;
  display: grid; place-items: center;
  pointer-events: none;
  perspective: 900px;
  transition: left .9s cubic-bezier(.22,1,.36,1), top .9s cubic-bezier(.22,1,.36,1);
}
.dog-shadow {
  position: absolute; bottom: 0;
  width: 96px; height: 11px;
  border-radius: 50%;
  background: rgba(79,70,229,.14);
  filter: blur(2px);
  animation: dog-shadow 3s ease-in-out infinite;
}
@keyframes dog-shadow {
  0%, 100% { transform: scaleX(1); opacity: .8; }
  50% { transform: scaleX(.7); opacity: .4; }
}
.shiba-img {
  position: relative;
  width: 230px; height: auto; display: block;
  transform-origin: center 92%;
  animation: dog-breathe 3s ease-in-out infinite;
  -webkit-user-drag: none;
}
@keyframes dog-breathe {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-6px) scale(1.01, .99); }
}
/* 点击冒烟反馈 */
.puff {
  position: absolute; left: 40px; top: 94px;
  width: 9px; height: 9px; border-radius: 50%;
  background: rgba(140,148,160,.55);
  filter: blur(3px); opacity: 0; pointer-events: none;
}
.dog-stage.pop .puff { animation: puff-rise .95s ease-out; }
.dog-stage.pop .puff.p2 { animation-delay: .12s; left: 35px; top: 92px; }
.dog-stage.pop .puff.p3 { animation-delay: .24s; left: 45px; top: 96px; }
@keyframes puff-rise {
  0% { opacity: 0; transform: translate(0,0) scale(.6); }
  25% { opacity: .75; }
  100% { opacity: 0; transform: translate(-18px,-54px) scale(2.3); }
}
.dog-stage:active .shiba-img { animation: none; transform: scale(1.05) rotate(-3deg); }
.dog-stage.pop .shiba-img { animation: dog-pop .46s cubic-bezier(.34,1.56,.64,1); }
@keyframes dog-pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.16) rotate(6deg); }
  100% { transform: scale(1); }
}
.dog-stage.running .shiba-img { animation: var(--run-anim, dog-hop) var(--run-dur, .9s) cubic-bezier(.3,.7,.4,1); }
@keyframes dog-hop {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  28% { transform: translateY(-20px) rotate(-9deg); }
  60% { transform: translateY(-7px) rotate(7deg); }
  80% { transform: translateY(-2px) rotate(-3deg); }
}
/* 旋转一圈 */
@keyframes dog-spin {
  0% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.12); }
  100% { transform: rotate(360deg) scale(1); }
}
/* 左右横跳 */
@keyframes dog-shuffle {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  18% { transform: translateX(-24px) rotate(-14deg); }
  38% { transform: translateX(22px) rotate(13deg); }
  58% { transform: translateX(-15px) rotate(-9deg); }
  78% { transform: translateX(11px) rotate(6deg); }
}
/* 后空翻 */
@keyframes dog-flip {
  0% { transform: rotateY(0deg) translateY(0); }
  50% { transform: rotateY(180deg) translateY(-18px); }
  100% { transform: rotateY(360deg) translateY(0); }
}
/* 缩放弹跳 */
@keyframes dog-zoom {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.24, .84) translateY(6px); }
  60% { transform: scale(.88, 1.16) translateY(-12px); }
}
/* ===== 「找狗玩玩」按钮本身即狗窝 ===== */
.dog-btn { position: relative; }
.dog-btn .dog-face {
  display: none; position: absolute; left: 50%; top: 50%;
  width: 26px; height: 26px; object-fit: cover;
  transform: translate(-50%, -50%);
}
.dog-btn.occupied { border-color: #c7d2fe; background: #f5f7ff; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
.dog-btn.occupied:hover { border-color: #818cf8; background: #eef1ff; }
.dog-btn.occupied svg { opacity: 0; }
.dog-btn.occupied .dog-face { display: block; animation: face-idle 2.4s ease-in-out infinite; }
/* 狗出来后：按钮清空，不显示任何内容，仅保留可点击的框 */
.dog-btn.vacant svg { opacity: 0; }
.dog-btn.vacant .dog-face { display: none; }
.dog-btn.vacant:hover { border-color: #a5b4fc; background: #f5f7ff; }
@keyframes face-idle {
  0%, 100% { transform: translate(-50%,-50%) rotate(-4deg); }
  50%      { transform: translate(-50%,-50%) rotate(5deg) translateY(-1px); }
}
.dog-btn.chomp { animation: btn-chomp .5s cubic-bezier(.34,1.5,.5,1); }
@keyframes btn-chomp {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.22) rotate(-8deg); }
  55%  { transform: scale(.9) rotate(5deg); }
  100% { transform: scale(1); }
}
/* ===== 小狗转场：柔和烟雾、同步落影与轻微回弹 ===== */
.ghost-dog {
  position: fixed; left: 0; top: 0; width: 230px;
  transform-origin: center center; pointer-events: none; z-index: 9989;
  will-change: transform, opacity; backface-visibility: hidden;
  animation: ghost-fade .42s ease-out forwards;
}
@keyframes ghost-fade {
  0% { opacity: var(--gh-op, .12); }
  100% { opacity: 0; }
}
.fly-dog {
  position: fixed; left: 0; top: 0;
  width: 230px; height: auto;
  transform-origin: center center;
  pointer-events: none;
  z-index: 9999;
  will-change: transform, opacity;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.fly-dog-shadow {
  position: fixed; left: 0; top: 0;
  width: 104px; height: 18px; margin: -9px 0 0 -52px;
  border-radius: 50%; pointer-events: none; z-index: 9988;
  background: radial-gradient(ellipse, rgba(51,65,85,.22), rgba(79,70,229,.08) 48%, transparent 74%);
  will-change: transform, opacity;
}
.dog-aura {
  position: fixed; left: 0; top: 0;
  width: 64px; height: 64px; margin: -32px 0 0 -32px;
  border-radius: 50%; pointer-events: none; z-index: 9995;
  background: radial-gradient(circle, rgba(255,255,255,.94) 0 16%, rgba(165,180,252,.32) 34%, rgba(99,102,241,.12) 52%, transparent 72%);
  will-change: transform, opacity;
}
.dog-ring {
  position: fixed; left: 0; top: 0;
  width: 42px; height: 42px; margin: -21px 0 0 -21px;
  border: 1.5px solid rgba(99,102,241,.38); border-radius: 50%;
  pointer-events: none; z-index: 9996; will-change: transform, opacity;
}
.dog-mote {
  position: fixed; left: 0; top: 0;
  width: var(--mote-size, 5px); height: var(--mote-size, 5px);
  translate: -50% -50%;
  border-radius: 50%; pointer-events: none; z-index: 9997;
  background: var(--mote-color, #a5b4fc);
  box-shadow: 0 0 7px var(--mote-color, #a5b4fc);
  will-change: transform, opacity;
}
.smoke-ring {
  position: fixed; left: 0; top: 0;
  width: 48px; height: 40px; margin: -20px 0 0 -24px;
  border-radius: 50%; pointer-events: none; z-index: 9998;
  will-change: transform, opacity;
  background: radial-gradient(ellipse at 50% 50%,
    transparent 0 30%, rgba(148,163,184,.06) 38%,
    rgba(148,163,184,.23) 51%, rgba(203,213,225,.16) 60%, transparent 74%);
}
.smoke-ring::after {
  content: ''; position: absolute; inset: 5px 7px; border-radius: 50%;
  background: radial-gradient(ellipse, transparent 38%, rgba(255,255,255,.62) 54%, transparent 72%);
}
.dog-btn.dog-release { animation: dog-release .72s cubic-bezier(.22,1,.36,1); }
.dog-btn.dog-receive { animation: dog-receive .68s cubic-bezier(.22,1,.36,1); }
@keyframes dog-release {
  0%, 100% { transform: scale(1); }
  16% { transform: scale(.82,1.14); }
  34% { transform: scale(1.16,.88); }
  55% { transform: scale(.96,1.04); }
  74% { transform: scale(1.03,.98); }
}
@keyframes dog-receive {
  0%, 100% { transform: scale(1); }
  20% { transform: scale(1.18,.82); }
  43% { transform: scale(.9,1.12); }
  66% { transform: scale(1.05,.96); }
  82% { transform: scale(.98,1.02); }
}
@media (prefers-reduced-motion: reduce) {
  .dog-btn.dog-release, .dog-btn.dog-receive { animation-duration: .2s; }
}
/* ===== 彩蛋页原地逗弄（已在彩蛋页点按钮：不重置） ===== */
.dog-stage.tease .shiba-img { animation: dog-tease .62s cubic-bezier(.34,1.5,.5,1); }
@keyframes dog-tease {
  0%   { transform: translateY(0) rotate(0) scale(1); }
  25%  { transform: translateY(-22px) rotate(-14deg) scale(1.08); }
  55%  { transform: translateY(0) rotate(10deg) scale(.95,1.06); }
  78%  { transform: translateY(-6px) rotate(-5deg) scale(1.03); }
  100% { transform: translateY(0) rotate(0) scale(1); }
}
/* ===== 登场落地回弹 ===== */
.dog-stage.land .shiba-img { animation: dog-land .7s cubic-bezier(.3,1.4,.5,1); }
@keyframes dog-land {
  0%   { transform: translateY(0) scale(1.18,.8); }
  45%  { transform: translateY(-14px) scale(.94,1.1); }
  72%  { transform: translateY(0) scale(1.05,.95); }
  100% { transform: translateY(0) scale(1); }
}
/* 嘲讽气泡 */
.taunt-bubble {
  position: absolute; bottom: 100%; left: 50%;
  margin: 0 0 14px 0;
  transform: translate(-50%, 8px) scale(.9);
  transform-origin: bottom center;
  max-width: 240px; width: max-content;
  padding: 9px 14px;
  background: #312e81; color: #fff;
  font-size: 13px; font-weight: 650; line-height: 1.4;
  border-radius: 12px;
  box-shadow: 0 8px 22px rgba(49,46,129,.28);
  opacity: 0; pointer-events: none; white-space: normal;
  transition: opacity .3s ease, transform .42s cubic-bezier(.34,1.56,.64,1);
  z-index: 6;
}
.taunt-bubble::after {
  content: ''; position: absolute; top: 100%; left: 50%;
  transform: translateX(-50%);
  border: 7px solid transparent; border-top-color: #312e81;
}
.taunt-bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.easter-title {
  font-size: 17px; font-weight: 750; color: #312e81;
  letter-spacing: .3px;
}
.easter-hint {
  font-size: 12px; color: var(--text-3);
  text-align: center; line-height: 1.7;
}
.easter-hint b { color: var(--accent); font-weight: 700; }

/* ---------- 更新提示：从「找狗玩玩」按钮叼出的横幅 ---------- */
.update-card {
  position: fixed; left: 0; top: 0; z-index: 100;
  width: 300px; max-width: calc(100vw - 32px);
  transform-origin: top right; opacity: 0;
  cursor: pointer; pointer-events: none;
  will-change: transform, opacity; backface-visibility: hidden;
}
.update-card.ready { pointer-events: auto; }
.update-card img {
  display: block; width: 100%; height: auto;
  border-radius: 16px;
  box-shadow: 0 18px 50px rgba(15, 23, 42, .20), 0 3px 10px rgba(15, 23, 42, .10);
  transition: box-shadow .25s ease;
}
.update-card.ready:hover img {
  box-shadow: 0 24px 60px rgba(15, 23, 42, .26), 0 4px 14px rgba(99, 102, 241, .18);
}
.update-card .up-blink {
  position: absolute; left: 50%; top: 0; width: 1px; height: 1px; pointer-events: none;
}

.tiny-toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #1e293b; color: #fff;
  border-radius: 8px; padding: 8px 15px; font-size: 11.5px;
  z-index: 110; opacity: 0; pointer-events: none;
  transition: all .22s ease; box-shadow: 0 10px 28px rgba(15,23,42,.25);
}
.tiny-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 720px) {
  .announce { max-width: 150px; }
  .clock, .warm-mini-num { display: none; }
}

  border-radius: 8px;

let exitTimer = null;
function selectItem(gi) {
  if (gi < 0 || gi >= allItems.length) return;
  if (window.__dogFlying && document.getElementById('easter').classList.contains('show')) return;
  activeGlobalIdx = gi;

  const easter = document.getElementById('easter');
  const stage = document.getElementById('monsterStage');
  const fromEaster = easter.classList.contains('show');

  // 左侧选中态 / 分类展开立即更新
  const cat = document.getElementById('cat-' + allItems[gi].catIndex);
  if (cat) cat.classList.remove('collapsed');
  document.querySelectorAll('.tool').forEach(el => el.classList.remove('active'));
  const target = document.querySelector('.tool[data-gi="' + gi + '"]');
  if (target) target.classList.add('active');

  function openFrame() {
    document.querySelectorAll('.game-frame').forEach(el => el.classList.remove('active'));
    const frame = frameCache[gi] || createFrame(gi);
    if (!frame) return;
    frame.classList.add('active');
    startLoad(gi);
  }

  if (fromEaster) {
    // 彩蛋页 → 工具：切图6闪亮开心；网站同步显示，狗得瑟飞进顶栏狗窝
    stage.dataset.flee = '0';
    applyExpr(0);
    document.getElementById('tauntBubble').classList.remove('show');
    stage.classList.remove('running', 'pop', 'entering', 'tease', 'land');
    const fromRect = stage.getBoundingClientRect();
    const dogBtn = document.getElementById('dogBtn');
    const toRect = dogBtn.getBoundingClientRect();
    // 白底瞬间隐藏（不渐隐、不遮挡），网站立刻显示
    easter.style.transition = 'none';
    easter.classList.remove('show');
    void easter.offsetWidth;
    easter.style.transition = '';
    stage.style.visibility = 'hidden';
    openFrame();
    // 烟圈传送门：狗摆着拽脸钻进按钮，按钮轻抖反馈
    flyShiba(fromRect, toRect, 'exit', () => {
      if (activeGlobalIdx < 0) return; // 期间已被召唤回来
      document.getElementById('dogFace').src = shibaSrc();
      dogBtn.classList.remove('vacant');
      dogBtn.classList.add('occupied');
    });
  } else {
    // 已在工具页：直接切换
    openFrame();
  }
}
function createFrame(gi) {
  const item = allItems[gi];
  if (!item || !item.url) return null;
  if (frameCache[gi]) return frameCache[gi];
  const host = document.getElementById('stage');
  const frame = document.createElement('iframe');
  frame.className = 'game-frame';
  frame.id = 'frame-' + gi;
  frame.allow = 'clipboard-read; clipboard-write';
  frame.dataset.state = 'idle';
  frame.addEventListener('load', () => finishLoad(gi));
  frame.addEventListener('error', () => finishLoad(gi));
  host.appendChild(frame);
  frameCache[gi] = frame;
  return frame;
}
function startLoad(gi) {
  const frame = frameCache[gi];
  const item = allItems[gi];
  if (!frame || !item || frame.dataset.state !== 'idle') return;
  frame.dataset.state = 'loading';
  setProgress(true);
  frame.src = buildFrameUrl(item);
  setTimeout(() => { if (frame.dataset.state === 'loading') finishLoad(gi); }, 8000);
}
function finishLoad(gi) {
  const frame = frameCache[gi];
  if (!frame || frame.dataset.state !== 'loading') return;
  frame.dataset.state = 'loaded';
  setProgress(false);
  updateWarm();
}

/* ---------- 后台串行预热 ---------- */
let warmQueue = [];
let warming = false;
function warmAll() {
  // 默认展开的分类优先预热，其次才是默认收起的
  warmQueue = allItems
    .map((_, i) => i)
    .filter(i => i !== activeGlobalIdx)
    .sort((a, b) => {
      const pa = CATEGORIES[allItems[a].catIndex].collapsed ? 1 : 0;
      const pb = CATEGORIES[allItems[b].catIndex].collapsed ? 1 : 0;
      return pa - pb || a - b;
    });
  pumpWarm();
}
function pumpWarm() {
  if (warming || warmQueue.length === 0) { updateWarm(); return; }
  const gi = warmQueue.shift();
  const frame = frameCache[gi] || createFrame(gi);
  if (!frame) { pumpWarm(); return; }
  if (frame.dataset.state === 'loaded') { pumpWarm(); return; }
  warming = true;
  startLoad(gi);
  const release = () => {
    if (!warming) return;
    warming = false;
    const next = () => pumpWarm();
    if ('requestIdleCallback' in window) requestIdleCallback(next, { timeout: 1500 });
    else setTimeout(next, 300);
  };
  frame.addEventListener('load', release, { once: true });
  frame.addEventListener('error', release, { once: true });
  setTimeout(release, 9000);
}

function openCurrent() {

document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.ctrlKey || e.metaKey) {
    const num = parseInt(e.key);
    if (num >= 1 && num <= 9) {
      e.preventDefault();
      const gi = num - 1;
      if (gi < allItems.length) selectItem(gi);
    }
  }
});

let versionUpdateDetected = false;
let updateIdleAnim = null;
let cardOrigin = null;

function cardTarget() {
  const w = 300;
  return { x: Math.max(16, window.innerWidth - 18 - w), y: 62, w: w, h: w * 223 / 472 };
}
function btnCenter() {
  const r = document.getElementById('dogBtn').getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
function showUpdateCard() {
  const card = document.getElementById('updateCard');
  if (card.dataset.shown === '1') return;
  card.dataset.shown = '1';
  const btn = document.getElementById('dogBtn');
  const b = btnCenter(), t = cardTarget();
  // 起点：缩在按钮里
  const sx = b.x - t.w / 2, sy = b.y - t.h / 2;
  const ex = t.x, ey = t.y;
  const mx = (sx + ex) / 2, my = Math.min(sy, ey) - 26;
  cardOrigin = { sx, sy, ex, ey };
  btn.classList.remove('chomp', 'dog-release'); void btn.offsetWidth;
  btn.classList.add('chomp');
  const anim = card.animate([
    { transform: `translate(${sx}px,${sy}px) scale(.08) rotate(-12deg)`, opacity: 0, offset: 0 },
    { transform: `translate(${mx}px,${my}px) scale(.55) rotate(7deg)`, opacity: 1, offset: .55 },
    { transform: `translate(${ex}px,${ey}px) scale(1.06) rotate(-1.5deg)`, opacity: 1, offset: .82 },
    { transform: `translate(${ex}px,${ey}px) scale(1) rotate(0)`, opacity: 1, offset: 1 }
  ], { duration: 780, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
  let landed = false;
  const land = () => {
    if (landed) return;
    landed = true;
    card.classList.add('ready');
    // 落定后：探头呼吸 + 偶发"眨眼"压缩
    const img = card.querySelector('img');
    updateIdleAnim = img.animate([
      { transform: 'translateY(0) scaleY(1)' },
      { transform: 'translateY(-3px) scaleY(1.035)', offset: .28 },
      { transform: 'translateY(0) scaleY(1)', offset: .55 },
      { transform: 'translateY(1px) scaleY(.945)', offset: .62 },
      { transform: 'translateY(0) scaleY(1)', offset: .7 },
      { transform: 'translateY(0) scaleY(1)' }
    ], { duration: 3400, iterations: Infinity, easing: 'ease-in-out' });
  };
  anim.onfinish = land;
  setTimeout(land, 820); // 兜底：切后台/动画被打断时仍可点击
}
function refreshFromCard() {
  const card = document.getElementById('updateCard');
  if (card.dataset.leaving === '1') return;
  card.dataset.leaving = '1';
  card.classList.remove('ready');
  if (updateIdleAnim) { updateIdleAnim.cancel(); updateIdleAnim = null; }
  const o = cardOrigin || cardTarget();
  const b = btnCenter();
  const sx = o.sx, sy = o.sy, ex = o.ex, ey = o.ey;
  const mx = (sx + ex) / 2, my = (sy + ey) / 2 - 18;
  const btn = document.getElementById('dogBtn');
  btn.classList.remove('chomp'); void btn.offsetWidth;
  btn.classList.add('dog-receive');
  const anim = card.animate([
    { transform: `translate(${ex}px,${ey}px) scale(1) rotate(0)`, opacity: 1, offset: 0 },
    { transform: `translate(${mx}px,${my}px) scale(.48) rotate(9deg)`, opacity: .92, offset: .5 },
    { transform: `translate(${sx}px,${sy}px) scale(.06) rotate(-10deg)`, opacity: 0, offset: 1 }
  ], { duration: 540, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' });
  let finished = false;
  const finish = () => { if (finished) return; finished = true; doRefresh(); };
  anim.onfinish = finish;
  setTimeout(finish, 580); // 兜底：确保点击后一定会刷新
}
async function checkVersion() {
  if (versionUpdateDetected || !VERSION_CHECK_URL) return;
  try {
    const resp = await fetch(VERSION_CHECK_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) return;
    const data = await resp.json();
    const remoteVersion = String(data.version || '');
    if (!remoteVersion) return;

    hubVersion = remoteVersion;
    let seen = '';
    try { seen = localStorage.getItem(VERSION_ACK_KEY) || ''; } catch (e) {}

    if (seen !== remoteVersion) {
      versionUpdateDetected = true;
      showUpdateCard();
    }
  } catch (e) {}
}
function doRefresh() {
  try { localStorage.setItem(VERSION_ACK_KEY, hubVersion); } catch (e) {}
  location.reload();
}

// 按逃跑次数映射表情：挡位=floor(fleeCount/3)（0起）
// 1-3档→图1，4-5→图2，6→图3，7→图4，8→图5；重置(0)→图6（映射不变，仅速度越来越慢）
function exprIndexForFlee(fleeCount) {
  if (fleeCount <= 0) return 5;
  const tier = Math.floor(fleeCount / 3); // 0..7
  if (tier <= 2) return 0;   // 挡位 1-3
  if (tier <= 4) return 1;   // 挡位 4-5
  if (tier === 5) return 2;  // 挡位 6
  if (tier === 6) return 3;  // 挡位 7
  return 4;                  // 挡位 8
}
function applyExpr(fleeCount) {
  const img = document.getElementById('shibaImg');
  if (img) img.src = SHIBA_EXPRS[exprIndexForFlee(fleeCount)];
}

(function initEaster() {
  const easter = document.getElementById('easter');
  const stage = document.getElementById('monsterStage');
  const bubble = document.getElementById('tauntBubble');
  const DW = 240, DH = 232;
  const WARN = 76, ESCAPE = 330;
  let bubbleTimer = null, runningTimer = null, lastIdx = -1;
  let lastFleeAt = 0;
  // 只防同一帧高频重复，不等待动画/位移结束 → 鼠标靠近可立即打断当前动画
  const FLEE_GAP = 80;
  // 每 3 次逃跑降速一档：动画时长与位移同步变慢（共 8 档，越躲越慢）
  // 挡位1最快(.14s) → 挡位8最慢(.9s)
  const SPEED_TIERS = [
    { anim: .145, move: .116 },
    { anim: .20, move: .22 },
    { anim: .27, move: .29 },
    { anim: .36, move: .38 },
    { anim: .46, move: .48 },
    { anim: .58, move: .6  },
    { anim: .72, move: .74 },
    { anim: .9,  move: .9  }
  ];
  const ANIMS = ['dog-hop', 'dog-spin', 'dog-shuffle', 'dog-flip', 'dog-zoom'];
  let lastAnim = '';

  function place(x, y) { stage.style.left = x + 'px'; stage.style.top = y + 'px'; }
  function center() {
    place((easter.clientWidth - DW) / 2, (easter.clientHeight - DH) / 2 + 28);
  }
  // 首屏定位：先禁用过渡，避免从左上角滑入
  stage.style.transition = 'none';
  requestAnimationFrame(() => { center(); requestAnimationFrame(() => { stage.style.transition = ''; }); });
  window.addEventListener('resize', () => { if (!stage.dataset.moved) center(); });

  // 点到矩形的最短距离（0 表示指针落在矩形内）
  function distToRect(mx, my, rx, ry, rw, rh) {
    const dx = Math.max(rx - mx, 0, mx - (rx + rw));
    const dy = Math.max(ry - my, 0, my - (ry + rh));
    return Math.hypot(dx, dy);
  }

  function flee(mx, my) {
    const now = performance.now();
    if (now - lastFleeAt < FLEE_GAP) return;
    lastFleeAt = now;
    const w = easter.clientWidth, h = easter.clientHeight;
    const minX = 16, maxX = Math.max(minX, w - DW - 16);
    const minY = 64, maxY = Math.max(minY, h - DH - 32);
    let nx = minX, ny = minY, found = false;
    for (let t = 0; t < 40; t++) {
      const tx = minX + Math.random() * (maxX - minX);
      const ty = minY + Math.random() * (maxY - minY);
      if (distToRect(mx, my, tx, ty, DW, DH) >= ESCAPE) { nx = tx; ny = ty; found = true; break; }
    }
    if (!found) {
      let best = -1;
      for (let t = 0; t < 24; t++) {
        const tx = minX + Math.random() * (maxX - minX);
        const ty = minY + Math.random() * (maxY - minY);
        const d = distToRect(mx, my, tx, ty, DW, DH);
        if (d > best) { best = d; nx = tx; ny = ty; }
      }
    }
    place(nx, ny);
    stage.dataset.moved = '1';
    const fleeCount = (+stage.dataset.flee || 0) + 1;
    stage.dataset.flee = fleeCount;
    applyExpr(fleeCount);

    const tier = SPEED_TIERS[Math.min(SPEED_TIERS.length - 1, Math.floor(fleeCount / 3))];
    let anim;
    do { anim = ANIMS[Math.floor(Math.random() * ANIMS.length)]; }
    while (ANIMS.length > 1 && anim === lastAnim);
    lastAnim = anim;
    stage.style.setProperty('--run-anim', anim);
    stage.style.setProperty('--run-dur', tier.anim + 's');
    stage.style.transitionDuration = tier.move + 's';
    clearTimeout(runningTimer);
    stage.classList.remove('running', 'pop');
    void stage.offsetWidth;
    stage.classList.add('running');
    runningTimer = setTimeout(() => stage.classList.remove('running'), tier.anim * 1000 + 50);

    let idx = 0;
    if (TAUNTS.length > 1) {
      do { idx = Math.floor(Math.random() * TAUNTS.length); } while (idx === lastIdx);
    }
    lastIdx = idx;
    bubble.textContent = TAUNTS[idx] || '……';
    bubble.classList.remove('show');
    void bubble.offsetWidth;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 3400);

  }

  // 鼠标靠近就逃：进入警戒圈立即跑开
  easter.addEventListener('mousemove', (e) => {
    if (!easter.classList.contains('show')) return;
    if (window.__dogFlying || stage.classList.contains('land') || stage.classList.contains('entering')) return;
    const r = stage.getBoundingClientRect();
    if (distToRect(e.clientX, e.clientY, r.left, r.top, r.width, r.height) < WARN) {
      flee(e.clientX, e.clientY);
    }
  });
})();

/* ---------- 小狗飞行 / 登场 / 逗弄 ---------- */
function shibaSrc() { return document.getElementById('shibaImg').src; }
/* 统一的柔和转场：蓄力 -> 弧线移动 -> 缓落/收回。只使用 transform 与 opacity。 */
const DOG_MOTION = {
  smooth: t => t * t * (3 - 2 * t),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3)
};
function removeAfterAnimation(el, frames, options) {
  document.body.appendChild(el);
  if (!el.animate) {
    setTimeout(() => el.remove(), (options.duration || 500) + (options.delay || 0));
    return null;
  }
  const anim = el.animate(frames, options);
  anim.onfinish = () => el.remove();
  return anim;
}
function spawnSmoke(x, y, delay, scale, dx, dy) {
  setTimeout(() => {
    const s = document.createElement('div');
    s.className = 'smoke-ring';
    s.style.left = x + 'px'; s.style.top = y + 'px';
    const rot = Math.random() * 50 - 25;
    removeAfterAnimation(s, [
      { opacity: 0, transform: 'translate3d(0,0,0) scale(.28) rotate(' + rot + 'deg)' },
      { opacity: .62, offset: .2 },
      { opacity: 0, transform: 'translate3d(' + (dx || 0) + 'px,' + (dy == null ? -34 : dy) + 'px,0) scale(' + (scale || 2.4) + ') rotate(' + (rot + 24) + 'deg)' }
    ], { duration: 880, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' });
  }, delay || 0);
}
function spawnPortal(x, y, mode, delay) {
  setTimeout(() => {
    const closing = mode === 'exit';
    const aura = document.createElement('div');
    aura.className = 'dog-aura';
    aura.style.left = x + 'px'; aura.style.top = y + 'px';
    removeAfterAnimation(aura, [
      { opacity: 0, transform: closing ? 'scale(1.5)' : 'scale(.25)' },
      { opacity: .82, offset: .28 },
      { opacity: 0, transform: closing ? 'scale(.18)' : 'scale(1.65)' }
    ], { duration: 620, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
    for (let i = 0; i < 2; i++) {
      const ring = document.createElement('div');
      ring.className = 'dog-ring';
      ring.style.left = x + 'px'; ring.style.top = y + 'px';
      removeAfterAnimation(ring, [
        { opacity: 0, transform: closing ? 'scale(1.55)' : 'scale(.3)' },
        { opacity: .58 - i * .14, offset: .24 },
        { opacity: 0, transform: closing ? 'scale(.22)' : 'scale(' + (1.65 + i * .42) + ')' }
      ], { duration: 650, delay: i * 80, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
    }
  }, delay || 0);
}
function spawnMotes(x, y, mode, delay) {
  setTimeout(() => {
    const closing = mode === 'exit';
    const colors = ['#818cf8', '#a5b4fc', '#c4b5fd', '#94a3b8'];
    for (let i = 0; i < 7; i++) {
      const p = document.createElement('div');
      p.className = 'dog-mote';
      const a = -Math.PI * .88 + i * Math.PI * .28 + (Math.random() - .5) * .18;
      const r = 24 + Math.random() * 25;
      const size = 3 + Math.random() * 3;
      p.style.left = x + 'px'; p.style.top = y + 'px';
      p.style.setProperty('--mote-size', size + 'px');
      p.style.setProperty('--mote-color', colors[i % colors.length]);
      const ox = Math.cos(a) * r, oy = Math.sin(a) * r;
      removeAfterAnimation(p, [
        { opacity: 0, transform: closing ? 'translate3d(' + ox + 'px,' + oy + 'px,0) scale(.5)' : 'translate3d(0,0,0) scale(.35)' },
        { opacity: .72, offset: .25 },
        { opacity: 0, transform: closing ? 'translate3d(0,0,0) scale(.15)' : 'translate3d(' + ox + 'px,' + (oy + 9) + 'px,0) scale(.8)' }
      ], { duration: 560 + Math.random() * 160, delay: i * 18, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
    }
  }, delay || 0);
}
function pulseDogButton(kind) {
  const btn = document.getElementById('dogBtn');
  const cls = kind === 'exit' ? 'dog-receive' : 'dog-release';
  btn.classList.remove('dog-release', 'dog-receive', 'chomp');
  void btn.offsetWidth;
  btn.classList.add(cls);
  setTimeout(() => btn.classList.remove(cls), 760);
}
function spawnGhost(src, x, y, sx, sy, rot, delay) {
  setTimeout(() => {
    const g = document.createElement('img');
    g.className = 'ghost-dog';
    g.src = src;
    g.alt = '';
    g.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) scale(' + sx + ',' + sy + ') rotate(' + rot + 'deg)';
    g.style.setProperty('--gh-op', '.1');
    document.body.appendChild(g);
    setTimeout(() => g.remove(), 460);
  }, delay || 0);
}

// 飞行分身：二次贝塞尔弧线 + 细密关键帧，避免直线平移和突兀转向。
function flyShiba(fromRect, toRect, mode, done) {
  const fly = document.createElement('img');
  fly.className = 'fly-dog';
  fly.src = shibaSrc();
  fly.alt = '';
  document.body.appendChild(fly);
  window.__dogFlying = true;

  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isExit = mode === 'exit';
  const NW = 230, NH = fly.offsetHeight || 222;
  const fcx = fromRect.left + fromRect.width / 2, fcy = fromRect.top + fromRect.height / 2;
  const tcx = toRect.left + toRect.width / 2, tcy = toRect.top + toRect.height / 2;
  const fx = fcx - NW / 2, fy = fcy - NH / 2;
  const tx = tcx - NW / 2, ty = tcy - NH / 2;
  const s0 = fromRect.width >= 100 ? 1 : fromRect.width / NW;
  const s1 = toRect.width >= 100 ? 1 : toRect.width / NW;
  const dx = tx - fx, dy = ty - fy;
  const len = Math.hypot(dx, dy) || 1;
  const dir = dx >= 0 ? 1 : -1;
  const dur = reduced ? 340 : (isExit ? 960 : 1120);
  const lift = reduced ? 0 : Math.min(112, Math.max(48, len * .15));
  const side = reduced ? 0 : Math.min(30, len * .045) * dir;
  const cx = (fx + tx) / 2 + side;
  const cy = Math.max(56, Math.min(fy, ty) - lift);
  const T = (x, y) => 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0)';
  const point = u => {
    const v = 1 - u;
    return [v * v * fx + 2 * v * u * cx + u * u * tx,
            v * v * fy + 2 * v * u * cy + u * u * ty];
  };
  const pose = (x, y, sx, sy, rot) => T(x, y) + ' scale(' + sx.toFixed(4) + ',' + sy.toFixed(4) + ') rotate(' + rot.toFixed(2) + 'deg)';
  const frames = [];
  const add = (offset, transform, opacity) => frames.push({ offset, transform, opacity: opacity == null ? 1 : opacity, easing: 'linear' });

  if (!isExit) {
    // 出场：狗窝轻压后释放；身体逐渐展开，空中只有很小的倾斜。
    add(0, pose(fx, fy, s0 * .55, s0 * .55, 0), 0);
    add(.055, pose(fx, fy + 2, s0 * 1.12, s0 * .78, 0), .9);
    const steps = reduced ? 10 : 34;
    for (let i = 0; i <= steps; i++) {
      const u = i / steps;
      const p = point(DOG_MOTION.inOut(u));
      const base = s0 + (s1 - s0) * DOG_MOTION.out(u);
      const launch = Math.pow(1 - u, 3);
      const stretch = reduced ? 0 : launch * .16 + Math.sin(Math.PI * u) * .035;
      const rot = reduced ? 0 : -dir * (launch * 3 + Math.sin(Math.PI * u) * 8);
      add(.11 + u * .69, pose(p[0], p[1] - launch * 5, base * (1 - stretch), base * (1 + stretch), rot));
    }
    // 落地三段式：轻压缩、小幅回弹、稳定。
    add(.855, pose(tx, ty + 5, s1 * 1.09, s1 * .89, 0));
    add(.925, pose(tx, ty - 6, s1 * .975, s1 * 1.035, 0));
    add(.968, pose(tx, ty + 1, s1 * 1.012, s1 * .99, 0));
    add(1, pose(tx, ty, s1, s1, 0));
  } else {
    // 回收：先小蹲蓄力，再沿同一套弧线轻盈回到狗窝。
    add(0, pose(fx, fy, s0, s0, 0));
    add(.07, pose(fx, fy + 8, s0 * 1.075, s0 * .9, dir * 3));
    const steps = reduced ? 10 : 34;
    for (let i = 0; i <= steps; i++) {
      const u = i / steps;
      const p = point(DOG_MOTION.inOut(u));
      const base = s0 + (s1 - s0) * DOG_MOTION.smooth(u);
      const launch = Math.pow(1 - u, 3);
      const stretch = reduced ? 0 : launch * .065 + Math.sin(Math.PI * u) * .03;
      const rot = reduced ? 0 : dir * (Math.sin(Math.PI * u) * 7 - launch * 4);
      const fade = 1 - DOG_MOTION.smooth(Math.max(0, (u - .84) / .16)) * .35;
      add(.135 + u * .715, pose(p[0], p[1] - launch * 10, base * (1 - stretch), base * (1 + stretch), rot), fade);
    }
    add(.91, pose(tx, ty, s1 * .72, s1 * .9, 0), .62);
    add(1, pose(tx, ty, s1 * .12, s1 * .12, 0), 0);
  }

  const shadow = document.createElement('div');
  shadow.className = 'fly-dog-shadow';
  shadow.style.left = (isExit ? fcx : tcx) + 'px';
  shadow.style.top = ((isExit ? fy : ty) + NH - 7) + 'px';
  document.body.appendChild(shadow);
  const shadowFrames = isExit ? [
    { opacity: .62, transform: 'scale(1)' },
    { opacity: .3, transform: 'scale(.72)', offset: .16 },
    { opacity: 0, transform: 'scale(.35)', offset: .4 },
    { opacity: 0, transform: 'scale(.35)' }
  ] : [
    { opacity: 0, transform: 'scale(.25)' },
    { opacity: 0, transform: 'scale(.35)', offset: .46 },
    { opacity: .38, transform: 'scale(.72)', offset: .72 },
    { opacity: .72, transform: 'scale(1.12)', offset: .86 },
    { opacity: .58, transform: 'scale(1)' }
  ];

  if (isExit) {
    setTimeout(() => pulseDogButton('exit'), dur * .76);
    spawnPortal(tcx, tcy, 'exit', dur * .72);
  } else {
    pulseDogButton('enter');
    spawnPortal(fcx, fcy, 'enter', 0);
  }
  if (!reduced) {
    if (isExit) {
      spawnSmoke(fcx - 28, fy + NH - 30, 70, 1.7, -24, -34);
      spawnSmoke(fcx + 26, fy + NH - 28, 135, 1.45, 26, -30);
      spawnMotes(tcx, tcy, 'exit', dur * .76);
    } else {
      spawnSmoke(fcx - 5, fcy + 4, 40, 1.25, -12, -24);
      spawnMotes(fcx, fcy, 'enter', 40);
      spawnSmoke(tcx - 42, ty + NH - 25, dur * .79, 1.8, -28, -26);
      spawnSmoke(tcx + 40, ty + NH - 24, dur * .82, 1.65, 30, -24);
      spawnMotes(tcx, ty + NH - 24, 'enter', dur * .82);
      const g1 = point(DOG_MOTION.inOut(.27)), g2 = point(DOG_MOTION.inOut(.43));
      const b1 = s0 + (s1 - s0) * DOG_MOTION.out(.27), b2 = s0 + (s1 - s0) * DOG_MOTION.out(.43);
      spawnGhost(fly.src, g1[0], g1[1], b1, b1, -dir * 6, dur * .31);
      spawnGhost(fly.src, g2[0], g2[1], b2, b2, -dir * 5, dur * .43);
    }
  }

  if (!fly.animate) {
    fly.remove(); shadow.remove(); window.__dogFlying = false;
    if (done) done();
    return;
  }
  const shadowAnim = shadow.animate(shadowFrames, { duration: dur, fill: 'forwards' });
  const anim = fly.animate(frames, { duration: dur, fill: 'forwards' });
  anim.onfinish = () => {
    fly.remove(); shadow.remove();
    if (shadowAnim) shadowAnim.cancel();
    window.__dogFlying = false;
    if (done) done();
  };
}
function backToEaster() {
  if (window.__dogFlying) return;
  const easter = document.getElementById('easter');
  const stage = document.getElementById('monsterStage');
  const dogBtn = document.getElementById('dogBtn');
  const wasOnEaster = easter.classList.contains('show');
  // 清理工具现场
  activeGlobalIdx = -1;
  clearTimeout(exitTimer);
  document.querySelectorAll('.game-frame').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tool').forEach(el => el.classList.remove('active'));

  if (wasOnEaster) {
    // 已在彩蛋页：不重置挡位/表情，只逗它蹦一下
    stage.classList.remove('running', 'pop', 'tease', 'land', 'entering');
    void stage.offsetWidth;
    stage.classList.add('tease');
    setTimeout(() => stage.classList.remove('tease'), 660);
    return;
  }

  // 从工具页回来：重置速度挡位 + 切图6闪亮开心
  stage.dataset.flee = '0';
  stage.dataset.moved = '';
  applyExpr(0);
  document.getElementById('tauntBubble').classList.remove('show');
  stage.classList.remove('running', 'pop', 'tease', 'land', 'entering');

  // 按钮释放小狗：先清空按钮，释放回弹由飞行动画统一驱动。
  const fromRect = dogBtn.getBoundingClientRect();
  dogBtn.classList.remove('occupied');
  dogBtn.classList.add('vacant');
  // 显示彩蛋页（白底柔和渐显），狗本体先藏起来
  easter.classList.add('show');
  stage.style.visibility = 'hidden';
  // 工作区中央落点
  const er = easter.getBoundingClientRect();
  const DW = 240, DH = 232;
  const toRect = {
    left: er.left + (er.width - DW) / 2,
    top: er.top + (er.height - DH) / 2 + 28,
    width: DW, height: DH
  };
  flyShiba(fromRect, toRect, 'enter', () => {
    // 落地回弹已包含在飞行动画中，本体无缝接管，避免二次弹跳。
    stage.style.left = ((easter.clientWidth - DW) / 2) + 'px';
    stage.style.top = ((easter.clientHeight - DH) / 2 + 28) + 'px';
    stage.style.transition = 'none';
    stage.style.visibility = 'visible';
    void stage.offsetWidth;
    stage.style.transition = '';
  });
}
/* ---------- 绑定 ---------- */
document.getElementById('dogBtn').addEventListener('click', backToEaster);
document.getElementById('updateCard').addEventListener('click', refreshFromCard);
document.getElementById('updateCard').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); refreshFromCard(); } });
window.addEventListener('resize', () => { if (!versionUpdateDetected) return; const c = document.getElementById('updateCard'); const t = cardTarget(); c.style.transform = `translate(${t.x}px,${t.y}px) scale(1)`; });
document.getElementById('openBtn').addEventListener('click', openCurrent);
document.getElementById('toggleSideBtn').addEventListener('click', toggleSide);

/* ---------- 初始化 ---------- */
// 公告跑马灯环
(function initAnnounce() {
  const parts = ANNOUNCEMENT_TEXT.split('|').map(s => s.trim()).filter(Boolean);
  const line = parts.join('　·　');
  const track = document.getElementById('announceTrack');
  track.innerHTML = `<span>${escapeHtml(line)}</span><span>${escapeHtml(line)}</span>`;
  // 恒速
  track.style.setProperty('--marquee-dur', Math.max(14, line.length * 0.55) + 's');
})();
tickClock();
setInterval(tickClock, 1000);
applySide();
buildIndex();
renderSidebar();
updateWarm();
// 彩蛋页
if (allItems.length > 0) {
  setTimeout(warmAll, 300);
}
setInterval(checkVersion, VERSION_CHECK_INTERVAL);
setTimeout(checkVersion, 5000);
</script>
<script>
(function () {
  var wrap = document.getElementById('ghThemeSwitch');
  var btn = document.getElementById('ghThemeSwitchBtn');
  if (!wrap || !btn) return;
  function closeMenu() {
    wrap.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
  }
  btn.addEventListener('click', function (event) {
    event.stopPropagation();
    var open = !wrap.classList.contains('open');
    wrap.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', function (event) {
    if (!wrap.contains(event.target)) closeMenu();
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeMenu();
  });
})();
</script>
